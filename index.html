    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DST Cook Pot Simulator",
        "url": "https://jitrudeedongdee.github.io/Don-t-starve-together-pot/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": ["th", "en"],
        "description": "Test Don't Starve Together crock pot combinations: drop in four ingredients and see which dish you get, with exact health, hunger and sanity values from the game files.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Jitrudee Dongdee" }
      }
    </script>

    <script>
      // Restores the real path after 404.html bounced us here (see public/404.html).
      // Runs before React Router mounts so it reads the correct URL.
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
