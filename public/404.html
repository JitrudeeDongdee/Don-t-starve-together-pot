<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>DST Cook Pot Simulator</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct hit on /recipes
      // returns this 404 page. Encode the requested path into a query string and
      // bounce to index.html, where the snippet in <head> restores the real URL
      // before React Router boots. Based on rafgraph/spa-github-pages.
      //
      // 1 = the number of path segments that belong to the project base
      //     (/Don-t-starve-together-pot/), not to the app's own routes.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
